name: Sprint 2 RC Smoke

on:
  push:
    branches:
      - sprint2-premium-experience
  workflow_dispatch:

jobs:
  rc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Sprint 2.5 RC
        run: |
          python - <<'PY'
          import time, urllib.request, sys

          base="https://levelyougift.github.io/levelyou/qa/sprint2-rc/"
          expected='data-levelyou-build="2026-10-06-sprint2-complete-rc1"'
          html=None
          last=None

          for _ in range(18):
              try:
                  with urllib.request.urlopen(base, timeout=20) as r:
                      body=r.read().decode("utf-8")
                      if r.status==200 and expected in body and "smart-fast-sprint2.js?v=2.5-rc1" in body and "smart-checkout-sprint2.js?v=2.5-rc1" in body:
                          html=body
                          break
                      last=f"status={r.status}, build={expected in body}"
              except Exception as e:
                  last=repr(e)
              time.sleep(5)

          if html is None:
              raise SystemExit("RC not propagated: "+str(last))

          for path in ("smart-fast-sprint2.js?v=2.5-rc1","smart-checkout-sprint2.js?v=2.5-rc1","play.html"):
              with urllib.request.urlopen(base+path, timeout=20) as r:
                  if r.status != 200:
                      raise SystemExit(f"{path}: HTTP {r.status}")

          if 'id="qaFinalBtn"' not in html:
              raise SystemExit("QA final-video button missing")
          if 'id="framePhotoBtn"' not in html or 'id="frameModal"' not in html:
              raise SystemExit("Framing controls missing")
          with urllib.request.urlopen(base+"play.html",timeout=20) as r:
              player=r.read().decode("utf-8")
              required=("safeFraming","drawVideoFrame","answerFeedback","videoLead","scoreSecondary","finishReveal")
              missing=[x for x in required if x not in player]
              if missing:
                  raise SystemExit("Final Sprint 2 Player missing: "+", ".join(missing))

          print("Sprint 2 complete public RC smoke: PASS")
          PY
