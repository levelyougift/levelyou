name: Harden LevelYou uploads

on:
  push:
    paths:
      - '.github/workflows/harden-levelyou-uploads.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upload hardening
        run: python scripts/harden_uploads.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "levelyougift"
          git config user.email "levelyougift@gmail.com"
          git add index.html
          git commit -m "Harden mobile photo uploads"
          git push
