name: Harden LevelYou uploads

on:
  push:
    paths:
      - '.github/workflows/harden-levelyou-uploads.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch upload reliability and production copy
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_fn = r'''async function uploadSignedPhoto(upload, blob) {
  const formData = new FormData();

  formData.append('cacheControl', '3600');
  formData.append('', blob);

  const response = await fetch(upload.signedUrl, {
    method: 'PUT',
    body: formData
  });

  if (!response.ok) {
    const detail = await response.text().catch(() => '');
    throw new Error(
      `Photo upload failed: ${response.status} ${detail}`
    );
  }
}'''

          new_fn = r'''const waitMs = ms => new Promise(resolve => setTimeout(resolve, ms));

async function uploadSignedPhoto(upload, blob, maxAttempts = 3) {
  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 30000);

    try {
      const formData = new FormData();
      formData.append('cacheControl', '3600');
      formData.append('', blob);

      const response = await fetch(upload.signedUrl, {
        method: 'PUT',
        body: formData,
        signal: controller.signal
      });

      if (response.ok) return;

      const detail = await response.text().catch(() => '');
      lastError = new Error(`Photo upload failed: ${response.status} ${detail}`);
    } catch (error) {
      lastError = error;
    } finally {
      clearTimeout(timeout);
    }

    if (attempt < maxAttempts) await waitMs(650 * attempt);
  }

  throw lastError || new Error('Photo upload failed');
}

async function uploadPhotosReliably(uploads, blobs) {
  for (let index = 0; index < uploads.length; index++) {
    await uploadSignedPhoto(uploads[index], blobs[index], 3);
  }
}'''

          old_upload = r'''    // 4. Subimos las 5 fotos al Storage privado
    await Promise.all(
      orderData.uploads.map((upload, index) =>
        uploadSignedPhoto(upload, blobs[index])
      )
    );'''

          new_upload = r'''    // 4. Subimos las 5 fotos al Storage privado.
    // En móvil lo hacemos de forma secuencial y con reintentos automáticos.
    await uploadPhotosReliably(orderData.uploads, blobs);'''

          replacements = [
            (old_fn, new_fn, 'upload helper'),
            (old_upload, new_upload, 'upload execution'),
            ("privacy:'Las fotos se procesan solo en tu dispositivo durante esta prueba.'", "privacy:'Tus fotos se guardan de forma privada y solo se utilizan para crear tu LevelYou.'", 'privacy es'),
            ("privacy:'Les fotos es processen només al teu dispositiu durant aquesta prova.'", "privacy:'Les teves fotos es guarden de forma privada i només s’utilitzen per crear el teu LevelYou.'", 'privacy ca'),
            ("privacy:'Photos are processed only on your device during this test.'", "privacy:'Your photos are stored privately and used only to create your LevelYou.'", 'privacy en'),
            ("earlyAccess:'Acceso anticipado: todavía no se realizará ningún cargo.'", "earlyAccess:'Pago seguro: tu LevelYou se activa automáticamente al confirmar el pago con Stripe.'", 'payment es'),
            ("earlyAccess:'Accés anticipat: encara no es farà cap càrrec.'", "earlyAccess:'Pagament segur: el teu LevelYou s’activa automàticament quan Stripe confirma el pagament.'", 'payment ca'),
            ("earlyAccess:'Early access: you will not be charged yet.'", "earlyAccess:'Secure payment: your LevelYou activates automatically when Stripe confirms payment.'", 'payment en'),
            ('data-levelyou-build="2026-10-03-r7"', 'data-levelyou-build="2026-10-05-r8"', 'build marker'),
          ]

          for old, new, label in replacements:
            if old not in s:
              raise SystemExit(f'Expected text not found for {label}; refusing partial patch')
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "levelyougift"
          git config user.email "levelyougift@gmail.com"
          git add index.html
          git commit -m "Harden mobile photo uploads"
          git push
