name: Sprint 1 QA

on:
  push:
    branches: [main]
    paths:
      - "sprint1.html"
      - "smart-sprint1.js"
      - "qa-lock-sprint1.js"
      - "play-sprint1.html"
      - ".github/workflows/qa-sprint1.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation
        run: sleep 25

      - name: Verify published page and assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://levelyougift.github.io/levelyou"
          for i in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/sprint1.html -w '%{http_code}' "$base/sprint1.html?qa=${GITHUB_SHA}")"
            if [ "$code" = "200" ]; then break; fi
            echo "Pages returned $code; waiting..."
            sleep 15
          done
          test "$code" = "200"
          grep -q 'smart-sprint1.js' /tmp/sprint1.html
          grep -q 'qa-lock-sprint1.js' /tmp/sprint1.html
          curl -fsS "$base/smart-sprint1.js?qa=${GITHUB_SHA}" -o /tmp/smart.js
          curl -fsS "$base/qa-lock-sprint1.js?qa=${GITHUB_SHA}" -o /tmp/qa.js
          node --check /tmp/smart.js
          node --check /tmp/qa.js
          curl -fsS "$base/play-sprint1.html?qa=${GITHUB_SHA}" -o /tmp/play-sprint1.html
          grep -q 'get-game-sprint1' /tmp/play-sprint1.html
          grep -q 'DATA.dedication' /tmp/play-sprint1.html
          grep -q 'Un mensaje para ti' /tmp/play-sprint1.html

      - name: Verify Smart Memory health
        shell: bash
        run: |
          set -euo pipefail
          url="https://ezqfwynowrgcvsfykvkm.supabase.co/functions/v1/smart-memory"
          curl -fsS -H 'Origin: https://levelyougift.github.io' "$url" -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('configured') is True, d
          assert d.get('model') == 'gpt-5.6-luna', d
          print('health ok:', d)
          PY

      - name: Verify Sprint 1 checkout routing
        shell: bash
        run: |
          set -euo pipefail
          url="https://ezqfwynowrgcvsfykvkm.supabase.co/functions/v1/checkout-sprint1"
          curl -fsS -H 'Origin: https://levelyougift.github.io' "$url" -o /tmp/checkout-health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/checkout-health.json'))
          assert d.get('ok') is True, d
          assert d.get('stripeConfigured') is True, d
          assert d.get('successTarget','').endswith('/levelyou/play-sprint1.html'), d
          assert d.get('cancelTarget','').endswith('/levelyou/sprint1.html'), d
          print('checkout routing ok')
          PY

      - name: Verify Sprint 1 dedication retrieval
        shell: bash
        run: |
          set -euo pipefail
          url="https://ezqfwynowrgcvsfykvkm.supabase.co/functions/v1/get-game-sprint1?token=cd8c5908-ca56-47e7-b4ac-d511d1584fcd"
          status="$(curl -sS -o /tmp/game-sprint1.json -w '%{http_code}' -H 'Origin: https://levelyougift.github.io' "$url")"
          test "$status" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/game-sprint1.json'))
          assert d.get('personName') == 'QA Sprint 1', d.get('personName')
          assert d.get('dedication') == 'Dedicatoria QA Sprint 1', d.get('dedication')
          assert len(d.get('items',[])) == 5, len(d.get('items',[]))
          print('dedication retrieval ok')
          PY

      - name: Verify real AI image analysis
        shell: bash
        run: |
          set -euo pipefail
          url="https://ezqfwynowrgcvsfykvkm.supabase.co/functions/v1/smart-memory"
          python - <<'PY'
          import base64, json, struct, zlib
          w=h=128
          raw=b''.join(b'\x00'+bytes([30,144,255])*w for _ in range(h))
          def chunk(t,d):
              import binascii
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          data={
            "personName":"Alex",
            "age":40,
            "language":"es",
            "images":["data:image/png;base64,"+base64.b64encode(png).decode()],
            "hints":["Un recuerdo de prueba"]
          }
          json.dump(data,open('/tmp/request.json','w'))
          PY
          status="$(curl -sS -o /tmp/ai.json -w '%{http_code}' -X POST             -H 'Origin: https://levelyougift.github.io'             -H 'Content-Type: application/json'             --data-binary @/tmp/request.json "$url")"
          cat /tmp/ai.json
          echo
          test "$status" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ai.json'))
          m=d.get('memories')
          assert isinstance(m,list) and len(m)==1, d
          x=m[0]
          assert isinstance(x.get('suggested_context'),str) and x['suggested_context'].strip(), x
          assert isinstance(x.get('question'),str) and x['question'].strip(), x
          assert isinstance(x.get('answers'),list) and len(x['answers'])==3, x
          assert x.get('correct') in (0,1,2), x
          assert isinstance(d.get('suggested_dedication'),str), d
          print('AI response schema ok')
          PY

      - name: Verify text-only question regeneration
        shell: bash
        run: |
          set -euo pipefail
          url="https://ezqfwynowrgcvsfykvkm.supabase.co/functions/v1/smart-memory"
          cat > /tmp/questions.json <<'JSON'
          {
            "mode":"questions",
            "personName":"Alex",
            "age":40,
            "language":"es",
            "tone":"complicit",
            "memoryInputs":[
              {"visual_summary":"Dos personas posan en una calle peatonal entre edificios claros.","suggested_context":"Paseo juntos por una calle con encanto","context":"Un viaje en el que acabamos perdidos buscando dónde comer"},
              {"visual_summary":"Una persona está junto al mar en un día soleado.","suggested_context":"Un día junto al mar","context":"Ese día dijimos que solo estaríamos diez minutos en la playa"},
              {"visual_summary":"Varias personas están sentadas alrededor de una mesa con comida.","suggested_context":"Una comida para recordar","context":"La comida se alargó muchísimo y nadie quería levantarse"},
              {"visual_summary":"Dos personas sonríen en una terraza exterior.","suggested_context":"Una tarde de terraza","context":"La foto fue justo antes de pedir otra ronda"},
              {"visual_summary":"Una persona posa delante de un paisaje de montaña.","suggested_context":"Una escapada entre montañas","context":"Nos equivocamos de camino antes de llegar aquí"}
            ]
          }
          JSON
          start="$(date +%s)"
          status="$(curl -sS -o /tmp/questions-out.json -w '%{http_code}' -X POST             -H 'Origin: https://levelyougift.github.io'             -H 'Content-Type: application/json'             --data-binary @/tmp/questions.json "$url")"
          elapsed="$(( $(date +%s) - start ))"
          cat /tmp/questions-out.json
          echo
          echo "text-only elapsed: ${elapsed}s"
          test "$status" = "200"
          test "$elapsed" -lt 20
          python - <<'PY'
          import json
          d=json.load(open('/tmp/questions-out.json'))
          assert d.get('mode') == 'questions', d
          m=d.get('memories')
          assert isinstance(m,list) and len(m)==5, d
          for x in m:
              assert isinstance(x.get('question'),str) and x['question'].strip(), x
              assert isinstance(x.get('answers'),list) and len(x['answers'])==3, x
              assert x.get('correct') in (0,1,2), x
          print('text-only question regeneration ok')
          PY

      - name: Verify five-image Smart Creator batch
        shell: bash
        run: |
          set -euo pipefail
          url="https://ezqfwynowrgcvsfykvkm.supabase.co/functions/v1/smart-memory"
          python - <<'PY'
          import base64, json, struct, zlib, binascii
          w=h=128
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          imgs=[]
          for n in range(5):
              rgb=bytes([40+n*35,120,220-n*30])
              raw=b''.join(b'\x00'+rgb*w for _ in range(h))
              png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
              imgs.append("data:image/png;base64,"+base64.b64encode(png).decode())
          data={
            "personName":"Alex",
            "age":40,
            "language":"es",
            "images":imgs,
            "hints":["Recuerdo de prueba "+str(i+1) for i in range(5)]
          }
          json.dump(data,open('/tmp/request5.json','w'))
          PY
          status="$(curl -sS -o /tmp/ai5.json -w '%{http_code}' -X POST             -H 'Origin: https://levelyougift.github.io'             -H 'Content-Type: application/json'             --data-binary @/tmp/request5.json "$url")"
          cat /tmp/ai5.json
          echo
          test "$status" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ai5.json'))
          m=d.get('memories')
          assert isinstance(m,list) and len(m)==5, d
          for x in m:
              assert isinstance(x.get('suggested_context'),str) and x['suggested_context'].strip(), x
              assert isinstance(x.get('question'),str) and x['question'].strip(), x
              assert isinstance(x.get('answers'),list) and len(x['answers'])==3, x
              assert x.get('correct') in (0,1,2), x
          print('five-image batch ok')
          PY
