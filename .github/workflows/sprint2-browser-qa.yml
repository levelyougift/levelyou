name: Sprint 2 Browser QA

on:
  push:
    branches:
      - sprint2-premium-experience
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run staging browser acceptance
        env:
          STAGING_URL: https://levelyougift.github.io/levelyou/qa/sprint2-rc/
        run: |
          cat > sprint2-browser-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base = process.env.STAGING_URL;
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport:{width:1024,height:1366},
            locale:'es-ES',
            hasTouch:true,
            isMobile:false
          });
          const page = await context.newPage();
          const errors=[];
          page.on('pageerror', e=>errors.push('pageerror: '+e.message));
          page.on('console', m=>{ if(m.type()==='error') errors.push('console: '+m.text()); });

          const tinyPng = Buffer.from(
            'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFElEQVR4nGP4z8DAwMDAxMDAwAAAHgAB9HFkzgAAAABJRU5ErkJggg==',
            'base64'
          );

          function aiPayload(count, lang='es') {
            const qs = Array.from({length:count},(_,i)=>({
              suggested_context: lang==='ca' ? `Record especial ${i+1}` : lang==='en' ? `Special memory ${i+1}` : `Recuerdo especial ${i+1}`,
              visual_summary: `Visible test image ${i+1}`,
              question: lang==='ca' ? `Quin record és aquest ${i+1}?` : lang==='en' ? `Which memory is this ${i+1}?` : `¿Qué recuerdo es este ${i+1}?`,
              answers: lang==='ca' ? ['Opció correcta','Opció B','Opció C'] : lang==='en' ? ['Correct option','Option B','Option C'] : ['Opción correcta','Opción B','Opción C'],
              correct:0,
              needs_hint:false,
              hint_prompt:'',
              confidence:'high'
            }));
            return {memories:qs,suggested_dedication:lang==='ca'?'Per molts anys!':lang==='en'?'Happy birthday!':'¡Feliz cumpleaños!'};
          }

          await page.route('**/functions/v1/smart-memory', async route=>{
            const req=route.request();
            let body={}; try{body=req.postDataJSON()||{}}catch{}
            const count=body.mode==='questions' ? (body.memoryInputs?.length||1) : (body.images?.length||1);
            const payload=aiPayload(count,body.language||'es');
            if(body.mode==='questions'){
              payload.memories=payload.memories.map(({question,answers,correct})=>({question,answers,correct}));
            }
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(payload)});
          });

          let createOrderCalls=0, checkoutCalls=0, uploadCalls=0;
          const fakeOrder='11111111-1111-4111-8111-111111111111';
          await page.route('**/functions/v1/super-api', async route=>{
            createOrderCalls++;
            await route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({
                orderId:fakeOrder,
                uploads:Array.from({length:5},(_,i)=>({
                  path:`${fakeOrder}/photo-${i+1}.jpg`,
                  token:'test',
                  signedUrl:`https://upload.test/${i+1}`,
                  contentType:'image/jpeg'
                }))
              })
            });
          });
          await page.route('https://upload.test/**', async route=>{
            uploadCalls++;
            await route.fulfill({status:200,body:'ok'});
          });
          await page.route('**/functions/v1/checkout-sprint2-preview', async route=>{
            checkoutCalls++;
            await route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({
                url:`${base}?payment=cancelled&order_id=${fakeOrder}&lang=es`,
                orderId:fakeOrder
              })
            });
          });

          // Landing + exact staging build
          const landingResponse = await page.goto(base,{waitUntil:'networkidle'});
          console.log('LANDING_STATUS', landingResponse?.status());
          console.log('LANDING_URL', page.url());
          console.log('LANDING_TITLE', await page.title());
          console.log('LANDING_BODY_PREFIX', (await page.locator('body').innerText()).slice(0,300).replace(/\\s+/g,' '));
          assert.equal(landingResponse?.status(),200);
          assert.equal(await page.locator('body').getAttribute('data-levelyou-build'),'2026-10-06-sprint2-premium-rc1');
          assert.equal(await page.locator('#landing').isVisible(),true);
          assert.equal(await page.locator('#fullBtn').innerText(),'Crear su LevelYou · 14,90 €');
          assert.equal(await page.locator('#previewBtn').innerText(),'Ver una muestra con 1 foto');
          assert.equal(await page.locator('.language-label').innerText(),'IDIOMA');
          assert.equal(await page.locator('#currentFlag').getAttribute('data-flag'),'es');
          assert.equal(await page.locator('#currentFlag svg').getAttribute('aria-label'),'España');
          assert.equal(await page.locator('body').innerText().then(t=>t.includes('todavía no se realizará ningún cargo')),false);

          // Languages + flags
          await page.selectOption('#languageSelect','ca');
          assert.equal(await page.locator('#currentFlag').getAttribute('data-flag'),'ca');
          assert.equal(await page.locator('#currentFlag svg').getAttribute('aria-label'),'Catalunya');
          assert.equal(await page.locator('#fullBtn').innerText(),'Crea el seu LevelYou · 14,90 €');
          await page.selectOption('#languageSelect','en');
          assert.equal(await page.locator('.language-label').innerText(),'LANGUAGE');
          assert.equal(await page.locator('#currentFlag').getAttribute('data-flag'),'en');
          assert.equal(await page.locator('#currentFlag svg').getAttribute('aria-label'),'United Kingdom');
          assert.equal(await page.locator('#fullBtn').innerText(),'Create their LevelYou · €14.90');
          await page.selectOption('#languageSelect','es');

          // Main creator CTA + back
          await page.click('#fullBtn');
          assert.equal(await page.locator('#builder').isVisible(),true);
          assert.equal(await page.locator('#creatorJourney').isVisible(),true);
          assert.equal(await page.locator('#fullUploadFlow').isVisible(),true);
          assert.equal(await page.locator('#previewFlow').isVisible(),false);
          assert.equal(await page.locator('#questionTone option').count(),4);
          assert.equal(await page.locator('#dedication').count(),1);
          await page.click('#backBtn');
          assert.equal(await page.locator('#landing').isVisible(),true);

          // One-photo sample with mocked AI
          await page.click('#previewBtn');
          await page.fill('#name','Ana');
          await page.setInputFiles('#previewPhoto',{name:'memory.png',mimeType:'image/png',buffer:tinyPng});
          await page.fill('#previewContext','Un día especial juntos');
          await page.click('#generatePreviewBtn');
          await page.waitForSelector('#previewSection:not(.hidden)',{timeout:10000});
          assert.equal(await page.locator('#questionText').innerText(),'¿Qué recuerdo es este 1?');
          assert.equal(await page.locator('#a1').innerText(),'Opción correcta');
          await page.click('#a1');
          assert.match(await page.locator('#a1').innerText(),/✓/);
          await page.click('#editQuestionBtn');
          assert.equal(await page.locator('#questionEditor').isVisible(),true);
          await page.fill('#editQuestion','Pregunta editada de prueba');
          await page.click('#saveQuestionBtn');
          assert.equal(await page.locator('#questionText').innerText(),'Pregunta editada de prueba');
          await page.click('#previewBackBtn');
          assert.equal(await page.locator('#builder').isVisible(),true);
          await page.click('#backBtn');

          // Full five-photo flow with mocked AI
          await page.click('#fullBtn');
          await page.fill('#name','Lucía');
          const files=Array.from({length:5},(_,i)=>({name:`memory-${i+1}.png`,mimeType:'image/png',buffer:tinyPng}));
          await page.setInputFiles('#photoBatch',files);
          await page.waitForFunction(()=>document.querySelectorAll('#photoGrid img').length===5,{timeout:10000});
          assert.equal(await page.locator('#photoGrid img').count(),5);
          assert.equal(await page.locator('#continueEditBtn').isEnabled(),true);
          await page.click('#continueEditBtn');
          await page.waitForSelector('#fullEditFlow:not(.hidden)',{timeout:10000});
          assert.equal(await page.locator('#editMemoryImg').isVisible(),true);
          assert.equal(await page.locator('#editMemoryContext').inputValue(),'Recuerdo especial 1');
          assert.equal(await page.locator('#dedication').inputValue(),'¡Feliz cumpleaños!');
          for(let i=0;i<4;i++) await page.click('#nextMemoryBtn');
          assert.match(await page.locator('#editMemoryIndex').innerText(),/5/);
          for(let i=0;i<4;i++) await page.click('#prevMemoryBtn');
          await page.click('#generateFullBtn');
          await page.waitForSelector('#previewSection:not(.hidden)',{timeout:10000});
          assert.match(await page.locator('#qcounter').innerText(),/1.*5/);
          await page.click('#nextQ');
          assert.match(await page.locator('#qcounter').innerText(),/2.*5/);
          await page.click('#prevQ');

          // Checkout client: compression + fake uploads + fake checkout + cancel-return screen
          await page.click('#interestBtn');
          await page.waitForSelector('#paymentResume:not(.hidden)',{timeout:15000});
          assert.equal(createOrderCalls,1);
          assert.equal(uploadCalls,5);
          assert.equal(checkoutCalls,1);
          assert.equal(await page.locator('#resumeTitle').innerText(),'No has perdido nada.');
          assert.equal(await page.locator('#resumePaymentBtn').innerText(),'Volver al pago');
          assert.equal(await page.locator('#restartFromCancelBtn').innerText(),'Empezar otro LevelYou');
          assert.equal(await page.locator('#creatorJourney').isVisible(),false);
          await page.click('#restartFromCancelBtn');
          assert.equal(await page.locator('#landing').isVisible(),true);

          // Direct cancelled-return translations
          await page.goto(`${base}?payment=cancelled&order_id=${fakeOrder}&lang=ca`,{waitUntil:'networkidle'});
          assert.equal(await page.locator('#paymentResume').isVisible(),true);
          assert.equal(await page.locator('#resumeTitle').innerText(),'No has perdut res.');
          assert.equal(await page.locator('#resumePaymentBtn').innerText(),'Tornar al pagament');

          // Player with mocked paid-game API
          await page.unroute('**/functions/v1/smart-memory');
          await page.route('**/functions/v1/get-game-sprint1**', async route=>{
            const img='data:image/png;base64,'+tinyPng.toString('base64');
            await route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({
                personName:'Alex',age:30,language:'es',dedication:'Gracias por todos estos recuerdos.',
                items:Array.from({length:5},(_,i)=>({
                  photoUrl:img,context:'',question:`Pregunta premium ${i+1}`,
                  answers:['Correcta','Alternativa B','Alternativa C'],correct:0
                }))
              })
            });
          });
          await page.goto(`${base}?page=player&token=22222222-2222-4222-8222-222222222222`,{waitUntil:'networkidle'});
          await page.waitForSelector('#intro:not(.hidden)',{timeout:10000});
          assert.match(await page.locator('#introTitle').innerText(),/Alex/);
          await page.click('#startGame');
          assert.equal(await page.locator('#game').isVisible(),true);
          for(let i=0;i<5;i++){
            assert.equal(await page.locator('#question').innerText(),`Pregunta premium ${i+1}`);
            await page.locator('.answer').nth(i%3).click();
            if(i<4) await page.click('#next');
            else await page.click('#next');
          }
          await page.waitForSelector('#finish:not(.hidden)',{timeout:5000});
          assert.equal(await page.locator('#memoryText').innerText(),'Gracias por todos estos recuerdos.');
          await page.click('#again');
          assert.equal(await page.locator('#game').isVisible(),true);
          assert.equal(await page.locator('#question').innerText(),'Pregunta premium 1');

          // Browser surface quality
          const bodyScroll = await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
          assert.ok(bodyScroll.sw <= bodyScroll.cw + 1, `horizontal overflow ${bodyScroll.sw} > ${bodyScroll.cw}`);

          const meaningfulErrors=errors.filter(e=>!e.includes('favicon'));
          assert.deepEqual(meaningfulErrors,[]);

          await browser.close();
          console.log('Sprint 2 browser QA: PASS');
          JS
          node sprint2-browser-qa.mjs
