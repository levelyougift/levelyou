name: Sprint 2 Browser QA

on:
  push:
    branches:
      - sprint2-premium-experience
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Fast Creator browser acceptance
        run: |
          python3 -m http.server 4173 >/tmp/levelyou-http.log 2>&1 &
          cat > sprint24-browser-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base='http://127.0.0.1:4173/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:1024,height:1366},
            locale:'es-ES',
            hasTouch:true
          });
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});

          const tinyPng=Buffer.from(
            'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFElEQVR4nGP4z8DAwMDAxMDAwAAAHgAB9HFkzgAAAABJRU5ErkJggg==',
            'base64'
          );

          let aiCalls=0;
          await page.route('**/functions/v1/smart-memory',async route=>{
            aiCalls++;
            let body={};try{body=route.request().postDataJSON()||{}}catch{}
            assert.equal(body.mode,'analyze');
            assert.equal(body.images?.length,1);
            await route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({
                memories:[{
                  suggested_context:'',
                  visual_summary:'Visible test memory',
                  question:'¿Quién dijo que esto era una buena idea?',
                  answers:['Lucía','Carlos','Nadie lo admite'],
                  correct:2,
                  needs_hint:false,
                  hint_prompt:'',
                  confidence:'high'
                }],
                suggested_dedication:'¡Por muchos recuerdos más!'
              })
            });
          });

          let createOrderCalls=0,uploadCalls=0,checkoutCalls=0;
          const fakeOrder='11111111-1111-4111-8111-111111111111';
          await page.route('**/functions/v1/super-api',async route=>{
            createOrderCalls++;
            const body=route.request().postDataJSON();
            assert.equal(body.gameData.questions.length,5);
            assert.equal(body.gameData.questions[0].question,'Pregunta manual 1');
            assert.equal(body.gameData.questions[1].question,'¿Quién dijo que esto era una buena idea?');
            assert.equal(body.gameData.memories.length,5);
            assert.ok(body.gameData.memories[0].framing.zoom > 1.4);
            assert.ok(Math.abs(body.gameData.memories[0].framing.x) > 0.05);
            assert.equal(body.gameData.memories[1].framing.zoom,1);
            await route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({
                orderId:fakeOrder,
                uploads:Array.from({length:5},(_,i)=>({
                  path:`${fakeOrder}/photo-${i+1}.jpg`,
                  token:'test',
                  signedUrl:`https://upload.test/${i+1}`,
                  contentType:'image/jpeg'
                }))
              })
            });
          });
          await page.route('https://upload.test/**',async route=>{
            uploadCalls++;await route.fulfill({status:200,body:'ok'});
          });
          await page.route('**/functions/v1/checkout-sprint1',async route=>{
            checkoutCalls++;
            await route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({url:`${base}?payment=cancelled&order_id=${fakeOrder}&lang=es`,orderId:fakeOrder})
            });
          });

          const response=await page.goto(base,{waitUntil:'networkidle'});
          assert.equal(response?.status(),200);
          assert.equal(await page.locator('body').getAttribute('data-levelyou-build'),'2026-10-06-sprint2-framing-2.5');
          assert.equal(await page.locator('#landing').isVisible(),true);
          assert.equal(await page.locator('#currentFlag').getAttribute('data-flag'),'es');

          await page.selectOption('#languageSelect','ca');
          assert.equal(await page.locator('#currentFlag').getAttribute('data-flag'),'ca');
          await page.selectOption('#languageSelect','en');
          assert.equal(await page.locator('#currentFlag').getAttribute('data-flag'),'en');
          await page.selectOption('#languageSelect','es');

          await page.click('#fullBtn');
          await page.fill('#name','Lucía');

          const files=Array.from({length:5},(_,i)=>({
            name:`memory-${i+1}.png`,mimeType:'image/png',buffer:tinyPng
          }));
          await page.setInputFiles('#photoBatch',files);
          await page.waitForFunction(()=>document.querySelectorAll('#photoGrid img').length===5);
          assert.equal(aiCalls,0);

          await page.click('#continueEditBtn');
          await page.waitForSelector('#fullEditFlow:not(.hidden)');
          assert.equal(aiCalls,0);
          assert.equal(await page.locator('#fastQuestion').inputValue(),'');
          assert.equal(await page.locator('#fastDots .fast-dot').count(),5);

          // Memory 1: manual creation.
          await page.fill('#fastQuestion','Pregunta manual 1');
          await page.fill('#fastA1','Respuesta A1');
          await page.fill('#fastA2','Respuesta B1');
          await page.fill('#fastA3','Respuesta C1');
          await page.selectOption('#fastCorrect','1');
          assert.equal(await page.locator('#fastDots .fast-dot').nth(0).evaluate(el=>el.classList.contains('complete')),true);

          // Memory 1: manual framing (zoom + drag) persists independently from the question.
          await page.click('#framePhotoBtn');
          await page.waitForSelector('#frameModal:not(.hidden)');
          assert.equal(await page.locator('#frameModal').getAttribute('role'),'dialog');
          assert.match(await page.locator('#frameModalTitle').innerText(),/Ajusta/);
          await page.locator('#frameZoom').evaluate(el=>{el.value='1.6';el.dispatchEvent(new Event('input',{bubbles:true}))});
          const box=await page.locator('#frameStage').boundingBox();
          assert.ok(box);
          await page.mouse.move(box.x+box.width/2,box.y+box.height/2);
          await page.mouse.down();
          await page.mouse.move(box.x+box.width/2+50,box.y+box.height/2+20,{steps:5});
          await page.mouse.up();
          await page.click('#frameSaveBtn');
          assert.equal(await page.locator('#frameModal').isVisible(),false);
          const framing1=await page.evaluate(()=>window.levelYouFastCreator.framing()[0]);
          assert.ok(framing1.zoom>1.5);
          assert.ok(Math.abs(framing1.x)>0.05);
          assert.match(await page.locator('#editMemoryImg').getAttribute('style'),/scale\(1\.6/);

          // Memory 2: optional AI assistant, with a personal hint and selected tone.
          await page.click('#nextMemoryBtn');
          await page.click('#aiAssistBtn');
          assert.equal(await page.locator('#aiAssistPanel').isVisible(),true);
          assert.equal(await page.locator('#aiAssistPanel').getAttribute('role'),'dialog');
          assert.equal(await page.locator('#aiAssistPanel').getAttribute('aria-modal'),'true');
          assert.equal(await page.locator('#aiModalTitle').innerText(),'Ayúdame con esta pregunta ✨');
          assert.equal(await page.locator('body').evaluate(el=>el.classList.contains('fast-modal-open')),true);

          // Cancel closes the modal and restores the editor.
          await page.click('#aiCancelBtn');
          assert.equal(await page.locator('#aiAssistPanel').isVisible(),false);
          assert.equal(await page.locator('body').evaluate(el=>el.classList.contains('fast-modal-open')),false);

          // Escape also closes it.
          await page.click('#aiAssistBtn');
          await page.keyboard.press('Escape');
          assert.equal(await page.locator('#aiAssistPanel').isVisible(),false);

          // Open again and generate the suggestion.
          await page.click('#aiAssistBtn');
          await page.fill('#editMemoryContext','Fue nuestro primer viaje y perdimos las llaves.');
          await page.selectOption('#questionTone','complicit');
          await page.click('#aiGenerateBtn');
          await page.waitForFunction(()=>document.querySelector('#fastQuestion').value.includes('buena idea'));
          assert.equal(await page.locator('#aiAssistPanel').isVisible(),false);
          assert.equal(await page.locator('body').evaluate(el=>el.classList.contains('fast-modal-open')),false);
          assert.equal(aiCalls,1);
          assert.equal(await page.locator('#fastA3').inputValue(),'Nadie lo admite');

          // Memories 3-5: manual, no further AI calls.
          for(let n=3;n<=5;n++){
            await page.click('#nextMemoryBtn');
            await page.fill('#fastQuestion',`Pregunta manual ${n}`);
            await page.fill('#fastA1',`Respuesta A${n}`);
            await page.fill('#fastA2',`Respuesta B${n}`);
            await page.fill('#fastA3',`Respuesta C${n}`);
            await page.selectOption('#fastCorrect','0');
          }
          assert.equal(aiCalls,1);
          assert.equal(await page.locator('#fastDedicationBlock').isVisible(),true);
          await page.fill('#dedication','¡Feliz cumpleaños!');
          assert.equal(await page.locator('#generateFullBtn').isEnabled(),true);

          // Navigation by numbered dots preserves the edits.
          await page.locator('#fastDots .fast-dot').nth(0).click();
          assert.equal(await page.locator('#fastQuestion').inputValue(),'Pregunta manual 1');
          const persistedFrame=await page.evaluate(()=>window.levelYouFastCreator.framing()[0]);
          assert.ok(persistedFrame.zoom>1.5);
          assert.ok(Math.abs(persistedFrame.x)>0.05);
          await page.locator('#fastDots .fast-dot').nth(4).click();
          assert.equal(await page.locator('#fastQuestion').inputValue(),'Pregunta manual 5');

          await page.click('#generateFullBtn');
          await page.waitForSelector('#previewSection:not(.hidden)');
          assert.equal(await page.locator('#questionText').innerText(),'Pregunta manual 1');
          assert.match(await page.locator('#qcounter').innerText(),/1.*5/);
          await page.click('#nextQ');
          assert.equal(await page.locator('#questionText').innerText(),'¿Quién dijo que esto era una buena idea?');

          // Return to editor and verify content remains editable/persistent.
          await page.click('#editMemoriesBtn');
          await page.waitForSelector('#fullEditFlow:not(.hidden)');
          assert.equal(await page.locator('#fastQuestion').inputValue(),'¿Quién dijo que esto era una buena idea?');
          await page.locator('#fastDots .fast-dot').nth(0).click();
          assert.equal(await page.locator('#fastQuestion').inputValue(),'Pregunta manual 1');
          await page.click('#generateFullBtn');
          await page.waitForSelector('#previewSection:not(.hidden)');

          // Checkout still receives the finished 5-question game.
          await page.click('#interestBtn');
          await page.waitForSelector('#paymentResume:not(.hidden)',{timeout:15000});
          assert.equal(createOrderCalls,1);
          assert.equal(uploadCalls,5);
          assert.equal(checkoutCalls,1);
          assert.equal(await page.locator('[data-i18n="resumeTitle"]').innerText(),'No has perdido nada.');

          const meaningfulErrors=errors.filter(e=>!e.includes('favicon'));
          assert.deepEqual(meaningfulErrors,[]);

          await browser.close();
          console.log('Sprint 2.5 Framing browser QA: PASS');
          JS
          node sprint24-browser-qa.mjs
