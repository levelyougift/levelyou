name: LEVEL YOU V3 browser QA
on:
  push:
    paths:
      - 'test-v3/v3-candidate.html'
      - 'backend/v3-draft/v3-browser-qa.mjs'
      - '.github/workflows/v3-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Run actual browser tests
        run: node backend/v3-draft/v3-browser-qa.mjs
