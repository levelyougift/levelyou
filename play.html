<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1020">
<title>LevelYou — Tu juego</title>
<style>
:root{--bg:#0e1020;--card:#171a2d;--muted:#a9b0c4;--txt:#f7f8fc;--accent:#69e1cf;--accent2:#8fa7ff;--line:rgba(255,255,255,.09);--danger:#ff8e9d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(105,225,207,.13),transparent 35%),radial-gradient(circle at 100% 20%,rgba(143,167,255,.13),transparent 35%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:20px 16px 44px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 20px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em}.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 24px rgba(105,225,207,.6)}
.shareTop{border:1px solid var(--line);background:#24283f;color:#fff;border-radius:12px;padding:9px 12px;font-weight:700}.card{background:rgba(23,26,45,.9);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.24)}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#111426}.body{padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:6px 10px;border-radius:999px;background:rgba(105,225,207,.12);color:#a8f3e7;font-weight:700;font-size:12px}.count{color:var(--muted);font-size:12px}.question{font-size:25px;font-weight:800;line-height:1.18;margin:15px 0}.answer{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#1c2034;color:#fff;border-radius:14px;padding:14px;margin:9px 0;font-size:15px}.answer.correct{border-color:rgba(105,225,207,.75);background:rgba(105,225,207,.1)}.answer.wrong{border-color:rgba(255,142,157,.75);background:rgba(255,142,157,.1)}.answer:disabled{opacity:1}
.btn{appearance:none;border:0;border-radius:16px;padding:15px 18px;width:100%;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px;background:linear-gradient(135deg,var(--accent),#8ce8d9);color:#0d1720}.btn.secondary{background:#24283f;color:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:default}.hidden{display:none!important}.finish{text-align:center;padding:28px 20px}.finish .emoji{font-size:58px}.finish h1{font-size:30px;margin:8px 0}.finish p{color:#d6d9e5;line-height:1.5}.memoryBox{margin:18px 0 4px;padding:16px;border-radius:18px;border:1px solid rgba(105,225,207,.18);background:rgba(105,225,207,.06);text-align:left}.memoryBox strong{display:block;margin-bottom:5px}.memoryBox span{font-size:13px;color:#cbd0df;line-height:1.45}.videoStatus{font-size:13px!important;color:var(--muted)!important;margin:12px 0 0!important}.videoPreview{display:block;width:100%;max-height:520px;background:#05060c;border-radius:18px;margin-top:14px;border:1px solid var(--line)}.footer{text-align:center;color:#7f879e;font-size:12px;margin-top:22px}.loading{padding:42px 22px;text-align:center}.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.13);border-top-color:var(--accent);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{padding:32px 22px;text-align:center}.error h2{margin:0 0 8px}.error p{color:var(--muted);line-height:1.45}@media(max-width:430px){.wrap{padding-left:14px;padding-right:14px}.question{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="brand"><span class="dot"></span> LEVELYOU</div><button class="shareTop hidden" id="shareTop">Compartir</button></div>
  <div id="loading" class="card loading"><div class="spinner"></div><strong id="loadingText">Preparando tu LevelYou…</strong></div>
  <div id="error" class="card error hidden"><div style="font-size:48px">🎁</div><h2 id="errorTitle">No hemos podido abrir este LevelYou</h2><p id="errorText">Comprueba que el enlace sea correcto e inténtalo de nuevo.</p><button class="btn secondary" onclick="location.reload()" id="retryBtn">Reintentar</button></div>
  <div id="game" class="card hidden"><img id="photo" class="photo" alt="Recuerdo LevelYou"><div class="body"><div class="top"><span class="badge" id="badge"></span><span class="count" id="count"></span></div><div class="question" id="question"></div><div id="answers"></div><button class="btn hidden" id="next"></button></div></div>
  <div id="finish" class="card finish hidden">
    <div class="emoji">🎉</div><h1 id="finishTitle"></h1><p id="score"></p>
    <div class="memoryBox"><strong id="memoryTitle"></strong><span id="memoryText"></span></div>
    <button class="btn" id="createVideo"></button><p class="videoStatus hidden" id="videoStatus"></p>
    <video class="videoPreview hidden" id="videoPreview" controls playsinline></video>
    <button class="btn hidden" id="saveVideo"></button>
    <button class="btn secondary" id="share"></button><button class="btn secondary" id="again"></button>
  </div>
  <canvas id="videoCanvas" width="720" height="1280" class="hidden"></canvas>
  <div class="footer">LevelYou · Regalos personalizados</div>
</div>
<script>
const API='https://ezqfwynowrgcvsfykvkm.supabase.co/functions/v1/get-game';
const params=new URLSearchParams(location.search),token=params.get('token')||'';
let DATA=null,i=0,score=0,locked=false,videoBlob=null,videoFile=null;
const $=id=>document.getElementById(id);
const LANG={
 es:{loading:'Preparando tu LevelYou…',badge:'✨ Tu LevelYou',q:'Pregunta',next:'Siguiente →',finish:'¡LevelYou completado!',score:s=>'Has acertado '+s+' de 5',again:'Volver a jugar',share:'Compartir LevelYou',memoryTitle:'Y ahora, el recuerdo final',memoryText:'Convierte estos cinco momentos en un pequeño vídeo para guardar o enviar.',createVideo:'Crear vídeo recuerdo',creating:'Creando tu vídeo…',saveVideo:'Guardar / compartir vídeo',videoReady:'Tu vídeo ya está listo.',videoUnsupported:'Este navegador no permite crear el vídeo directamente. Puedes compartir el LevelYou con el botón de abajo.',videoError:'No hemos podido crear el vídeo. El juego sigue disponible y puedes compartirlo.',errorTitle:'No hemos podido abrir este LevelYou',errorText:'Comprueba que el enlace sea correcto e inténtalo de nuevo.',retry:'Reintentar',intro:'Un regalo hecho de recuerdos',outro:'Que nunca se olviden estos momentos'},
 ca:{loading:'Preparant el teu LevelYou…',badge:'✨ El teu LevelYou',q:'Pregunta',next:'Següent →',finish:'LevelYou completat!',score:s=>'Has encertat '+s+' de 5',again:'Tornar a jugar',share:'Compartir LevelYou',memoryTitle:'I ara, el record final',memoryText:'Converteix aquests cinc moments en un petit vídeo per guardar o enviar.',createVideo:'Crear vídeo record',creating:'Creant el teu vídeo…',saveVideo:'Guardar / compartir vídeo',videoReady:'El teu vídeo ja està llest.',videoUnsupported:'Aquest navegador no permet crear el vídeo directament. Pots compartir el LevelYou amb el botó de sota.',videoError:'No hem pogut crear el vídeo. El joc continua disponible i el pots compartir.',errorTitle:'No hem pogut obrir aquest LevelYou',errorText:'Comprova que l’enllaç sigui correcte i torna-ho a provar.',retry:'Torna-ho a provar',intro:'Un regal fet de records',outro:'Que aquests moments no s’oblidin mai'},
 en:{loading:'Preparing your LevelYou…',badge:'✨ Your LevelYou',q:'Question',next:'Next →',finish:'LevelYou complete!',score:s=>'You got '+s+' out of 5',again:'Play again',share:'Share LevelYou',memoryTitle:'And now, the final memory',memoryText:'Turn these five moments into a short video to save or send.',createVideo:'Create memory video',creating:'Creating your video…',saveVideo:'Save / share video',videoReady:'Your video is ready.',videoUnsupported:'This browser cannot create the video directly. You can still share the LevelYou below.',videoError:'We could not create the video. The game is still available and can be shared.',errorTitle:'We could not open this LevelYou',errorText:'Check the link and try again.',retry:'Try again',intro:'A gift made of memories',outro:'May these moments never be forgotten'}
};
let t=LANG.es;
function showError(message){$('loading').classList.add('hidden');$('game').classList.add('hidden');$('finish').classList.add('hidden');$('shareTop').classList.add('hidden');$('error').classList.remove('hidden');$('errorTitle').textContent=t.errorTitle;$('errorText').textContent=message||t.errorText;$('retryBtn').textContent=t.retry}
async function load(){if(!/^[0-9a-f-]{36}$/i.test(token)){showError();return}try{const r=await fetch(API+'?token='+encodeURIComponent(token),{method:'GET',cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Unable to load LevelYou');DATA=j;t=LANG[DATA.language]||LANG.es;document.documentElement.lang=DATA.language||'es';$('loadingText').textContent=t.loading;$('shareTop').textContent=t.share;$('loading').classList.add('hidden');$('shareTop').classList.remove('hidden');$('game').classList.remove('hidden');render()}catch(e){showError()}}
function render(){locked=false;$('next').classList.add('hidden');const x=DATA.items[i];$('photo').src=x.photoUrl;$('badge').textContent=t.badge;$('count').textContent=t.q+' '+(i+1)+' / '+DATA.items.length;$('question').textContent=x.question;const a=$('answers');a.innerHTML='';x.answers.forEach((v,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>pick(n,b);a.appendChild(b)});$('next').textContent=t.next}
function pick(n,b){if(locked)return;locked=true;const x=DATA.items[i];Array.from(document.querySelectorAll('.answer')).forEach((el,k)=>{el.disabled=true;if(k===x.correct)el.classList.add('correct')});if(n===x.correct)score++;else b.classList.add('wrong');$('next').classList.remove('hidden')}
function done(){$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('finishTitle').textContent=t.finish;$('score').textContent=t.score(score);$('memoryTitle').textContent=t.memoryTitle;$('memoryText').textContent=t.memoryText;$('createVideo').textContent=t.createVideo;$('saveVideo').textContent=t.saveVideo;$('again').textContent=t.again;$('share').textContent=t.share}
$('next').onclick=()=>{if(i<DATA.items.length-1){i++;render()}else done()};$('again').onclick=()=>{i=0;score=0;$('finish').classList.add('hidden');$('game').classList.remove('hidden');render()};
async function shareLink(){const d={title:'LevelYou',text:'🎁 Tengo un LevelYou para ti',url:location.href};if(navigator.share){try{await navigator.share(d);return}catch(e){if(e&&e.name==='AbortError')return}}location.href='https://wa.me/?text='+encodeURIComponent('🎁 Tengo un LevelYou para ti: '+location.href)}
$('share').onclick=shareLink;$('shareTop').onclick=shareLink;
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function imgFromUrl(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('image');const blob=await r.blob();const objectUrl=URL.createObjectURL(blob);try{return await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=objectUrl})}finally{setTimeout(()=>URL.revokeObjectURL(objectUrl),30000)}}
function cover(ctx,img,w,h,zoom=1){const s=Math.max(w/img.width,h/img.height)*zoom,dw=img.width*s,dh=img.height*s;ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh)}
function roundedRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function textBlock(ctx,title,sub){ctx.save();const g=ctx.createLinearGradient(0,820,0,1280);g.addColorStop(0,'rgba(14,16,32,0)');g.addColorStop(.35,'rgba(14,16,32,.72)');g.addColorStop(1,'rgba(14,16,32,.98)');ctx.fillStyle=g;ctx.fillRect(0,760,720,520);ctx.fillStyle='#69e1cf';roundedRect(ctx,52,930,176,45,23);ctx.fill();ctx.fillStyle='#0d1720';ctx.font='700 22px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';ctx.fillText('LEVELYOU',76,960);ctx.fillStyle='#fff';ctx.font='800 48px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';wrap(ctx,title,52,1035,616,58,2);if(sub){ctx.fillStyle='#d6d9e5';ctx.font='500 25px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';wrap(ctx,sub,52,1170,616,34,2)}ctx.restore()}
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){const words=String(text||'').split(/\s+/);let line='',lines=[];for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word;if(lines.length>=maxLines-1)break}else line=test}if(line&&lines.length<maxLines)lines.push(line);lines.forEach((l,n)=>ctx.fillText(l,x,y+n*lineHeight))}
async function generateVideo(){const status=$('videoStatus'),btn=$('createVideo');status.classList.remove('hidden');status.textContent=t.creating;btn.disabled=true;$('saveVideo').classList.add('hidden');$('videoPreview').classList.add('hidden');videoBlob=null;videoFile=null;try{const canvas=$('videoCanvas');if(!canvas.captureStream||!window.MediaRecorder)throw new Error('unsupported');let mime=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x))||'';const stream=canvas.captureStream(24);const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4500000}:{videoBitsPerSecond:4500000});const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=()=>reject(new Error('record'))});rec.start(250);const ctx=canvas.getContext('2d');const imgs=[];for(const item of DATA.items)imgs.push(await imgFromUrl(item.photoUrl));const name=DATA.personName||DATA.person_name||'';ctx.fillStyle='#0e1020';ctx.fillRect(0,0,720,1280);ctx.fillStyle='#69e1cf';ctx.beginPath();ctx.arc(360,410,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 64px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';wrap(ctx,name?('Para '+name):'LevelYou',70,565,580,72,2);ctx.fillStyle='#d6d9e5';ctx.font='500 30px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';ctx.fillText(t.intro,360,735);ctx.textAlign='left';await sleep(1200);for(let n=0;n<imgs.length;n++){const start=performance.now(),dur=1650;while(performance.now()-start<dur){const p=(performance.now()-start)/dur;ctx.fillStyle='#0e1020';ctx.fillRect(0,0,720,1280);cover(ctx,imgs[n],720,1280,1+.035*p);textBlock(ctx,'Recuerdo '+(n+1),DATA.items[n].question||'');await new Promise(requestAnimationFrame)}}ctx.fillStyle='#0e1020';ctx.fillRect(0,0,720,1280);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 56px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';wrap(ctx,t.outro,70,570,580,68,3);ctx.fillStyle='#69e1cf';ctx.font='700 26px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';ctx.fillText('LEVELYOU',360,820);ctx.textAlign='left';await sleep(1400);rec.stop();await stopped;videoBlob=new Blob(chunks,{type:rec.mimeType||'video/webm'});const ext=videoBlob.type.includes('mp4')?'mp4':'webm';videoFile=new File([videoBlob],`LevelYou-${name||'recuerdo'}.${ext}`,{type:videoBlob.type});$('videoPreview').src=URL.createObjectURL(videoBlob);$('videoPreview').classList.remove('hidden');$('saveVideo').classList.remove('hidden');status.textContent=t.videoReady}catch(e){status.textContent=e&&e.message==='unsupported'?t.videoUnsupported:t.videoError}finally{btn.disabled=false}}
$('createVideo').onclick=generateVideo;$('saveVideo').onclick=async()=>{if(!videoBlob||!videoFile)return;if(navigator.canShare&&navigator.share&&navigator.canShare({files:[videoFile]})){try{await navigator.share({files:[videoFile],title:'LevelYou'});return}catch(e){if(e&&e.name==='AbortError')return}}const u=URL.createObjectURL(videoBlob),a=document.createElement('a');a.href=u;a.download=videoFile.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)};
load();
</script>
</body>
</html>
