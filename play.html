<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1020">
<title>LevelYou — Tu juego</title>
<style>
:root{--bg:#0e1020;--card:#171a2d;--muted:#a9b0c4;--txt:#f7f8fc;--accent:#69e1cf;--accent2:#8fa7ff;--line:rgba(255,255,255,.09);--danger:#ff8e9d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(105,225,207,.13),transparent 35%),radial-gradient(circle at 100% 20%,rgba(143,167,255,.13),transparent 35%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:20px 16px 44px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 24px rgba(105,225,207,.6)}
.shareTop{border:1px solid var(--line);background:#24283f;color:#fff;border-radius:12px;padding:9px 12px;font-weight:700}
.card{background:rgba(23,26,45,.9);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 50px rgba(0,0,0,.24)}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#111426}
.body{padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.badge{padding:6px 10px;border-radius:999px;background:rgba(105,225,207,.12);color:#a8f3e7;font-weight:700;font-size:12px}.count{color:var(--muted);font-size:12px}
.question{font-size:25px;font-weight:800;line-height:1.18;margin:15px 0}
.answer{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#1c2034;color:#fff;border-radius:14px;padding:14px;margin:9px 0;font-size:15px}
.answer.correct{border-color:rgba(105,225,207,.75);background:rgba(105,225,207,.1)}.answer.wrong{border-color:rgba(255,142,157,.75);background:rgba(255,142,157,.1)}.answer:disabled{opacity:1}
.btn{appearance:none;border:0;border-radius:16px;padding:15px 18px;width:100%;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px;background:linear-gradient(135deg,var(--accent),#8ce8d9);color:#0d1720}
.btn.secondary{background:#24283f;color:#fff;border:1px solid var(--line)}
.hidden{display:none!important}.finish{text-align:center;padding:28px 20px}.finish .emoji{font-size:58px}.finish h1{font-size:30px;margin:8px 0}.finish p{color:#d6d9e5;line-height:1.5}.footer{text-align:center;color:#7f879e;font-size:12px;margin-top:22px}
.loading{padding:42px 22px;text-align:center}.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.13);border-top-color:var(--accent);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.error{padding:32px 22px;text-align:center}.error h2{margin:0 0 8px}.error p{color:var(--muted);line-height:1.45}
@media(max-width:430px){.wrap{padding-left:14px;padding-right:14px}.question{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand"><span class="dot"></span> LEVELYOU</div>
    <button class="shareTop hidden" id="shareTop">Compartir</button>
  </div>

  <div id="loading" class="card loading">
    <div class="spinner"></div>
    <strong id="loadingText">Preparando tu LevelYou…</strong>
  </div>

  <div id="error" class="card error hidden">
    <div style="font-size:48px">🎁</div>
    <h2 id="errorTitle">No hemos podido abrir este LevelYou</h2>
    <p id="errorText">Comprueba que el enlace sea correcto e inténtalo de nuevo.</p>
    <button class="btn secondary" onclick="location.reload()" id="retryBtn">Reintentar</button>
  </div>

  <div id="game" class="card hidden">
    <img id="photo" class="photo" alt="Recuerdo LevelYou">
    <div class="body">
      <div class="top"><span class="badge" id="badge"></span><span class="count" id="count"></span></div>
      <div class="question" id="question"></div>
      <div id="answers"></div>
      <button class="btn hidden" id="next"></button>
    </div>
  </div>

  <div id="finish" class="card finish hidden">
    <div class="emoji">🎉</div>
    <h1 id="finishTitle"></h1>
    <p id="score"></p>
    <button class="btn" id="again"></button>
    <button class="btn secondary" id="share"></button>
  </div>

  <div class="footer">LevelYou · Regalos personalizados</div>
</div>
<script>
const API='https://ezqfwynowrgcvsfykvkm.supabase.co/functions/v1/get-game';
const params=new URLSearchParams(location.search);
const token=params.get('token')||'';
let DATA=null,i=0,score=0,locked=false;
const $=id=>document.getElementById(id);
const LANG={
  es:{loading:'Preparando tu LevelYou…',badge:'✨ Tu LevelYou',q:'Pregunta',next:'Siguiente →',finish:'¡LevelYou completado!',score:s=>'Has acertado '+s+' de 5',again:'Volver a jugar',share:'Compartir',errorTitle:'No hemos podido abrir este LevelYou',errorText:'Comprueba que el enlace sea correcto e inténtalo de nuevo.',retry:'Reintentar'},
  ca:{loading:'Preparant el teu LevelYou…',badge:'✨ El teu LevelYou',q:'Pregunta',next:'Següent →',finish:'LevelYou completat!',score:s=>'Has encertat '+s+' de 5',again:'Tornar a jugar',share:'Compartir',errorTitle:'No hem pogut obrir aquest LevelYou',errorText:'Comprova que l’enllaç sigui correcte i torna-ho a provar.',retry:'Torna-ho a provar'},
  en:{loading:'Preparing your LevelYou…',badge:'✨ Your LevelYou',q:'Question',next:'Next →',finish:'LevelYou complete!',score:s=>'You got '+s+' out of 5',again:'Play again',share:'Share',errorTitle:'We could not open this LevelYou',errorText:'Check the link and try again.',retry:'Try again'}
};
let t=LANG.es;
function showError(message){$('loading').classList.add('hidden');$('game').classList.add('hidden');$('finish').classList.add('hidden');$('shareTop').classList.add('hidden');$('error').classList.remove('hidden');$('errorTitle').textContent=t.errorTitle;$('errorText').textContent=message||t.errorText;$('retryBtn').textContent=t.retry}
async function load(){
  if(!/^[0-9a-f-]{36}$/i.test(token)){showError();return}
  try{
    const r=await fetch(API+'?token='+encodeURIComponent(token),{method:'GET',cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'Unable to load LevelYou');
    DATA=j;t=LANG[DATA.language]||LANG.es;document.documentElement.lang=DATA.language||'es';
    $('loadingText').textContent=t.loading;$('shareTop').textContent=t.share;
    $('loading').classList.add('hidden');$('shareTop').classList.remove('hidden');$('game').classList.remove('hidden');render()
  }catch(e){showError()}
}
function render(){locked=false;$('next').classList.add('hidden');const x=DATA.items[i];$('photo').src=x.photoUrl;$('badge').textContent=t.badge;$('count').textContent=t.q+' '+(i+1)+' / '+DATA.items.length;$('question').textContent=x.question;const a=$('answers');a.innerHTML='';x.answers.forEach((v,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>pick(n,b);a.appendChild(b)});$('next').textContent=t.next}
function pick(n,b){if(locked)return;locked=true;const x=DATA.items[i];Array.from(document.querySelectorAll('.answer')).forEach((el,k)=>{el.disabled=true;if(k===x.correct)el.classList.add('correct')});if(n===x.correct)score++;else b.classList.add('wrong');$('next').classList.remove('hidden')}
function done(){$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('finishTitle').textContent=t.finish;$('score').textContent=t.score(score);$('again').textContent=t.again;$('share').textContent=t.share}
$('next').onclick=()=>{if(i<DATA.items.length-1){i++;render()}else done()};
$('again').onclick=()=>{i=0;score=0;$('finish').classList.add('hidden');$('game').classList.remove('hidden');render()};
async function share(){const shareData={title:'LevelYou',text:'🎁 Tengo un LevelYou para ti',url:location.href};if(navigator.share){try{await navigator.share(shareData);return}catch(e){if(e&&e.name==='AbortError')return}}location.href='https://wa.me/?text='+encodeURIComponent('🎁 Tengo un LevelYou para ti: '+location.href)}
$('share').onclick=share;$('shareTop').onclick=share;load();
</script>
</body>
</html>
