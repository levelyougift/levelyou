<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#090b15">
<title>LevelYou — Sprint 5 Reaction Lab</title>
<style>
:root{--bg:#090b15;--card:#121625;--txt:#fbfbfd;--muted:#9ea6ba;--accent:#7de4d3;--accent2:#9eafff;--warm:#f3d7a1;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% -5%,rgba(125,228,211,.15),transparent 31%),radial-gradient(circle at 92% 10%,rgba(158,175,255,.16),transparent 32%),linear-gradient(180deg,#090b15,#0b0e19 48%,#090b15);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:660px;margin:auto;padding:20px 16px 48px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:14px;font-weight:900;letter-spacing:.14em}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 26px rgba(125,228,211,.7)}.pill{font-size:11px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:#d9deeb;background:rgba(255,255,255,.035)}
.card{background:linear-gradient(180deg,rgba(23,28,45,.94),rgba(14,18,31,.96));border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 26px 80px rgba(0,0,0,.35)}.body{padding:20px}.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--warm);font-weight:900}.title{font-size:30px;line-height:1.05;letter-spacing:-.035em;margin:9px 0 7px}.sub{font-size:14px;color:#b3bccf;line-height:1.5;margin:0 0 16px}.upload{position:relative;display:flex;align-items:center;justify-content:center;min-height:76px;border:1px dashed rgba(125,228,211,.28);border-radius:16px;background:rgba(7,10,18,.56);font-size:13px;font-weight:800}.upload input{position:absolute;inset:0;opacity:0}
.photoViewport{width:100%;aspect-ratio:4/3;overflow:hidden;background:#080b14;position:relative}.photo{width:100%;height:100%;object-fit:contain;display:block;transform-origin:center;will-change:transform}.reactionLayer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;opacity:0;isolation:isolate}
.reactionLayer.good{opacity:1;background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.24) 0 3%,rgba(125,228,211,.18) 12%,rgba(158,175,255,.10) 34%,transparent 68%);animation:s5GlowGood 1.02s ease forwards}
.reactionLayer.good:before,.reactionLayer.good:after{content:"";position:absolute;left:50%;top:46%;width:86px;height:86px;border-radius:50%;border:3px solid rgba(255,255,255,.78);transform:translate(-50%,-50%) scale(.25);opacity:0;animation:s5Ring .86s cubic-bezier(.16,.75,.22,1) forwards}.reactionLayer.good:after{width:126px;height:126px;border-color:rgba(125,228,211,.58);animation-delay:.08s}
.reactionLayer.miss{opacity:1;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(129,74,46,.08) 48%,rgba(160,66,34,.18) 71%,rgba(38,12,10,.38) 100%);animation:s5GlowMiss .82s ease forwards}.reactionLayer.miss:after{content:"";position:absolute;inset:-18%;background:conic-gradient(from 30deg at 50% 50%,transparent 0 18%,rgba(246,165,94,.12) 22%,transparent 27% 47%,rgba(206,91,45,.10) 51%,transparent 57% 100%);filter:blur(14px);opacity:0;animation:s5EmberWash .78s ease forwards}
.photoViewport.reaction-correct{animation:s5CorrectFrame 1.02s cubic-bezier(.18,.8,.25,1)}.photoViewport.reaction-correct .photo{animation:s5ColorReveal 1.02s cubic-bezier(.18,.8,.25,1)}
.photoViewport.reaction-wrong{animation:s5WrongFrame .72s ease}.photoViewport.reaction-wrong .photo{animation:s5WrongTone .86s ease}
.reaction-confetti{position:absolute;left:50%;top:47%;width:var(--cw,8px);height:var(--ch,15px);border-radius:var(--cr,3px);background:var(--cc,#7de4d3);opacity:0;transform:translate(-50%,-50%);animation:s5Confetti 1.08s cubic-bezier(.12,.74,.24,1) var(--delay,0ms) forwards}.reaction-spark{position:absolute;left:50%;top:46%;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.95),0 0 20px rgba(125,228,211,.65);opacity:0;transform:translate(-50%,-50%) scale(.5);animation:s5Spark .72s ease var(--delay,0ms) forwards}
@keyframes s5CorrectFrame{0%{transform:scale(1)}34%{transform:scale(1.016);box-shadow:inset 0 0 64px rgba(125,228,211,.22)}66%{transform:scale(1.008);box-shadow:inset 0 0 34px rgba(158,175,255,.13)}100%{transform:scale(1)}}@keyframes s5ColorReveal{0%{filter:grayscale(.92) saturate(.35) brightness(.82) contrast(.96)}30%{filter:grayscale(.36) saturate(.82) brightness(.96)}58%{filter:grayscale(0) saturate(1.42) brightness(1.12)}100%{filter:none}}@keyframes s5GlowGood{0%{opacity:0}18%{opacity:1}54%{opacity:.9}100%{opacity:0}}@keyframes s5Ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.28)}20%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}@keyframes s5WrongFrame{0%,100%{transform:translateX(0)}12%{transform:translateX(-7px) rotate(-.25deg)}26%{transform:translateX(6px) rotate(.2deg)}42%{transform:translateX(-4px)}58%{transform:translateX(3px)}76%{transform:translateX(-1px)}}@keyframes s5WrongTone{0%{filter:none}24%{filter:grayscale(.9) saturate(.28) brightness(.75) contrast(1.08)}58%{filter:grayscale(.72) saturate(.4) brightness(.82) sepia(.10)}100%{filter:none}}@keyframes s5GlowMiss{0%{opacity:0}20%{opacity:1}62%{opacity:.9}100%{opacity:0}}@keyframes s5EmberWash{0%{opacity:0;transform:scale(.9)}34%{opacity:1}100%{opacity:0;transform:scale(1.08) rotate(5deg)}}@keyframes s5Confetti{0%{opacity:0;transform:translate(-50%,-50%) rotate(0deg) scale(.55)}9%{opacity:1}72%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(var(--cs,1))}}@keyframes s5Spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}24%{opacity:1;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(1.5)}100%{opacity:0;transform:translate(calc(-50% + var(--sx2)),calc(-50% + var(--sy2))) scale(.6)}}
.q{font-size:23px;font-weight:900;letter-spacing:-.02em;margin:16px 0 12px}.answer{width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:16px;padding:15px 16px;margin:8px 0;font-size:15px}.answer.correct{border-color:rgba(125,228,211,.72);background:rgba(125,228,211,.12)}.answer.wrong{border-color:rgba(243,215,161,.6);background:rgba(243,215,161,.08)}.feedback{margin-top:12px;padding:11px 13px;border-radius:14px;font-size:13px;font-weight:800;background:rgba(255,255,255,.035)}.feedback.good{color:#c7fff5}.feedback.miss{color:#f5dfb5}.btn{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:17px;font-weight:900;font-size:15px;background:linear-gradient(135deg,#8be9da,#d7f7ef);color:#07120f}.btn.secondary{background:rgba(255,255,255,.055);color:#fff;border:1px solid var(--line)}.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){.photoViewport.reaction-correct,.photoViewport.reaction-wrong,.photoViewport.reaction-correct .photo,.photoViewport.reaction-wrong .photo{animation:none!important}.reaction-confetti{display:none!important}.reactionLayer.good{animation:none;opacity:.32}.reactionLayer.miss{animation:none;opacity:.26}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div class="brand"><span class="dot"></span>LEVELYOU</div><div class="pill">SPRINT 5 · S5.1</div></div>
<div class="card">
<div class="body">
<div class="kicker">Reaction Lab</div>
<div class="title">Prueba las reacciones del juego</div>
<p class="sub">Sube una foto opcional y pulsa una respuesta correcta o incorrecta. No se sube ningún archivo ni se crea ningún pedido.</p>
<label class="upload">📷 Elegir una foto<input id="photoInput" type="file" accept="image/*"></label>
</div>
<div class="photoViewport"><img id="photo" class="photo" alt="Foto de prueba"><div class="reactionLayer" id="reaction"></div></div>
<div class="body">
<div class="q">¿Qué respuesta quieres probar?</div>
<button class="answer" id="correct">✨ Respuesta correcta</button>
<button class="answer" id="wrong">Respuesta incorrecta</button>
<div class="feedback hidden" id="feedback"></div>
<button class="btn secondary" id="reset">Resetear</button>
</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);let timer=null;
function reset(){if(timer){clearTimeout(timer);timer=null}const v=document.querySelector('.photoViewport'),l=$('reaction');v.classList.remove('reaction-correct','reaction-wrong');l.className='reactionLayer';l.innerHTML='';$('correct').className='answer';$('wrong').className='answer';$('feedback').className='feedback hidden';$('feedback').textContent=''}
function react(ok){reset();const v=document.querySelector('.photoViewport'),l=$('reaction');void v.offsetWidth;v.classList.add(ok?'reaction-correct':'reaction-wrong');l.classList.add(ok?'good':'miss');const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(ok&&!reduced){const colors=['#7de4d3','#f3d7a1','#9eafff','#ffffff','#ff9fbc','#8ff0c6'];Array.from({length:34},(_,n)=>{const angle=((n*137.5)%360)*Math.PI/180,radius=118+(n%7)*18;return{dx:Math.round(Math.cos(angle)*radius),dy:Math.round(Math.sin(angle)*radius-72-(n%4)*14),rot:(n%2?1:-1)*(150+(n*47)%360),color:colors[n%colors.length],delay:(n%8)*18,w:6+(n%4)*2,h:11+(n%5)*3,r:n%3===0?999:3,scale:.8+(n%5)*.12}}).forEach(o=>{const p=document.createElement('span');p.className='reaction-confetti';p.style.setProperty('--dx',o.dx+'px');p.style.setProperty('--dy',o.dy+'px');p.style.setProperty('--rot',o.rot+'deg');p.style.setProperty('--cc',o.color);p.style.setProperty('--delay',o.delay+'ms');p.style.setProperty('--cw',o.w+'px');p.style.setProperty('--ch',o.h+'px');p.style.setProperty('--cr',o.r+'px');p.style.setProperty('--cs',o.scale);l.appendChild(p)});[[-90,-70,-150,-120,0],[-48,-108,-84,-176,60],[0,-124,0,-198,25],[52,-104,92,-168,80],[94,-62,158,-112,35],[-110,-20,-176,-36,95],[112,-12,184,-22,50]].forEach(([sx,sy,sx2,sy2,delay])=>{const s=document.createElement('span');s.className='reaction-spark';s.style.setProperty('--sx',sx+'px');s.style.setProperty('--sy',sy+'px');s.style.setProperty('--sx2',sx2+'px');s.style.setProperty('--sy2',sy2+'px');s.style.setProperty('--delay',delay+'ms');l.appendChild(s)})}$((ok?'correct':'wrong')).classList.add(ok?'correct':'wrong');$('feedback').textContent=ok?'✨ Sí. Ahora el acierto tiene un reveal más potente.':'El fallo desatura la foto y añade un impacto más dramático.';$('feedback').className='feedback '+(ok?'good':'miss');timer=setTimeout(()=>{v.classList.remove('reaction-correct','reaction-wrong');l.className='reactionLayer';l.innerHTML=''},ok?1120:900)}
$('correct').onclick=()=>react(true);$('wrong').onclick=()=>react(false);$('reset').onclick=reset;
$('photoInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const u=URL.createObjectURL(f);$('photo').src=u;$('photo').onload=()=>setTimeout(()=>URL.revokeObjectURL(u),1000)};
const fallback=document.createElement('canvas');fallback.width=800;fallback.height=600;const x=fallback.getContext('2d');const g=x.createLinearGradient(0,0,800,600);g.addColorStop(0,'#334a68');g.addColorStop(.55,'#9eafff');g.addColorStop(1,'#7de4d3');x.fillStyle=g;x.fillRect(0,0,800,600);x.fillStyle='rgba(255,255,255,.9)';x.textAlign='center';x.font='700 44px -apple-system, BlinkMacSystemFont, Segoe UI';x.fillText('Tu foto aparecerá aquí',400,305);$('photo').src=fallback.toDataURL('image/jpeg',.85);
</script>
</body>
</html>
